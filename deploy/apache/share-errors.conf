# Include inside the TLS VirtualHost, BEFORE its catch-all ProxyPass /.
# Deploy the error assets under /var/www/errors first.
# This file replaces the existing LogLevel and CustomLog directives.

ProxyPass "/errors/" "!"
Alias "/errors/" "/var/www/errors/"

<Directory "/var/www/errors/">
    Require all granted
    AllowOverride None
    Options -Indexes -ExecCGI -Includes
</Directory>
<Directory "/var/www/errors/api/">
    ForceType application/json
    AddDefaultCharset UTF-8
</Directory>

# Preserve application responses, including API JSON and rendered HTML.
ProxyErrorOverride Off
LogLevel warn
ErrorLog ${APACHE_LOG_DIR}/error.share.jeanphilippe.io.log
LogFormat "%v %a %t method=%m protocol=%H status=%>s bytes=%B duration_us=%D request_id=%L" share_safe
CustomLog ${APACHE_LOG_DIR}/access.share.jeanphilippe.io.log share_safe

# Apache-generated browser errors use local copies of the existing views.
ErrorDocument 400 /errors/400.html
ErrorDocument 401 /errors/401.html
ErrorDocument 403 /errors/403.html
ErrorDocument 404 /errors/404.html
ErrorDocument 413 /errors/413.html
ErrorDocument 500 /errors/500.html
ErrorDocument 501 /errors/501.html
ErrorDocument 502 /errors/502.html
ErrorDocument 503 /errors/503.html
ErrorDocument 504 /errors/504.html
ErrorDocument 505 /errors/505.html
ErrorDocument 506 /errors/506.html
ErrorDocument 507 /errors/507.html
ErrorDocument 508 /errors/508.html

# Apache/WAF errors on API endpoints retain their status and use JSON.
<LocationMatch "^/api(?:/|$)">
    ErrorDocument 400 /errors/api/400.json
    ErrorDocument 401 /errors/api/401.json
    ErrorDocument 403 /errors/api/403.json
    ErrorDocument 404 /errors/api/404.json
    ErrorDocument 413 /errors/api/413.json
    ErrorDocument 500 /errors/api/500.json
    ErrorDocument 501 /errors/api/501.json
    ErrorDocument 502 /errors/api/502.json
    ErrorDocument 503 /errors/api/503.json
    ErrorDocument 504 /errors/api/504.json
    ErrorDocument 505 /errors/api/505.json
    ErrorDocument 506 /errors/api/506.json
    ErrorDocument 507 /errors/api/507.json
    ErrorDocument 508 /errors/api/508.json
</LocationMatch>
