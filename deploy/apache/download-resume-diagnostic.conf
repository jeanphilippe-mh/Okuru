# Temporary diagnostics for Okuru's ZIP downloads on Debian Apache 2.4.
# Include this file inside the HTTPS VirtualHost alongside its usual access log.
# Remove the Include after the test. Check the configuration with apache2ctl
# configtest and reload apache2 after enabling or disabling the diagnostic.

SetEnvIf Request_URI "^/file/[^/]+/download/[0-9a-f]{64}/?$" okuru_diag_zip
SetEnvIf Range ".+" okuru_diag_range
SetEnvIf If-Range ".+" okuru_diag_if_range
SetEnvIf Cookie "(^|;[[:blank:]]*)__Secure-okuru-dl-[^=;[:blank:]]+=" okuru_diag_cookie

# A marker is 1 if present, or - otherwise. The cookie marker does not
# authenticate the cookie. Read markers from the original request, even
# when an ErrorDocument triggers an internal redirect.
CustomLog "${APACHE_LOG_DIR}/okuru-resume-diag.log" "%t %<m original=%s status=%>s range=%<{okuru_diag_range}e if_range=%<{okuru_diag_if_range}e cookie=%<{okuru_diag_cookie}e" env=okuru_diag_zip
