# Optional, reviewed TLS VirtualHost include. Do not enable before checking
# the Apache-linked OpenSSL version, providers and existing group settings.
# OpenSSL 3.5+ is required for this form and X25519MLKEM768.
# DEFAULT retains OpenSSL's built-in groups, including classical fallback;
# it does not preserve a separate administrator-configured group list.
# If the virtual host already sets Groups X25519MLKEM768:X25519:P-384,
# do not add this include: it would replace that explicit group policy.
SSLOpenSSLConfCmd Groups X25519MLKEM768:DEFAULT
