# Optional deployment template: review the existing REQBODY_ERROR rule first.
# Include in this site's vhost before CRS phase-2 rules. Do not duplicate IDs.
# The existing JSON processor (normally rule 200001) must remain enabled.
# Leave SecRuleEngine On; do not disable parsing, the WAF, or CRS rules.
# The request body and parser error text are intentionally absent from logdata.
SecRule REQUEST_URI "@rx ^/api(?:/|$)" \
    "id:1001201,phase:2,t:none,deny,status:400,log,msg:'Malformed API request body rejected',chain"
    SecRule REQBODY_ERROR "!@eq 0" "t:none"
