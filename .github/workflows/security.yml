name: Security verification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      OKURU_TEST_REDIS_ADDR: 127.0.0.1:6379
      GOTELEMETRY: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go run ./tests/cmd/okurutest tidy -diff
      - run: go run ./tests/cmd/okurutest vet
      - run: go run ./tests/cmd/okurutest test -race -count=1
      - name: Verify systemd restarts a stalled Echo worker and restores HTTPS readiness
        run: python3 tests/systemd_watchdog.py
      - name: Install Apache for the ZIP continuation contract
        run: |
          if [[ ! -x /usr/sbin/apache2 ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends apache2-bin
          fi
      - name: Verify ZIP continuation through Apache over HTTP/2
        env:
          OKURU_TEST_APACHE_BIN: /usr/sbin/apache2
          OKURU_TEST_APACHE_MODULE_DIR: /usr/lib/apache2/modules
        run: go run ./tests/cmd/okurutest test -race -v -count=1 -run='^TestZIPContinuationThroughApache$' -- ./controllers
      - name: Verify resumable uploads through a capped proxy
        env:
          OKURU_TEST_LARGE_UPLOADS: "1"
        run: go run ./tests/cmd/okurutest test -v -count=1 -run=TestUploadClientLargeProxy -- ./router
      - run: node --test tests/*.test.js tests/*.test.cjs
      - run: python3 tests/tlsa/test_update_tlsa.py
      - run: python3 tests/tlsa/test_tlsa_terminal.py
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

